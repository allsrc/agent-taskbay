[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-taskbay"
version = "1.0.0"
description = "Lightweight Python SDK for Agent Taskbay — connect Python agents and workflows to the human-in-the-loop operations console."
readme = "README.md"
authors = [
    { name = "Shashi Kanth G S", email = "shashikanth@allsrc.dev" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = [
    "agent-taskbay",
    "human-in-the-loop",
    "hitl",
    "a2a",
    "a2a-protocol",
    "ai-agents",
    "langgraph",
    "crewai",
    "approval-gates"
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://taskbay.allsrc.dev"
Repository = "https://github.com/allsrc/agent-taskbay"
Documentation = "https://taskbay.allsrc.dev/docs"
Issues = "https://github.com/allsrc/agent-taskbay/issues"
