[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-taskbay"
version = "0.1.0"
description = "Experimental helper that serves an A2A agent and asks Agent Taskbay for an approval. Not a client SDK, and not published on PyPI."
readme = "README.md"
authors = [
    { name = "Shashi Kanth G S", email = "shashikanth@allsrc.dev" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = [
    "agent-taskbay",
    "a2a",
    "approval-request"
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://taskbay.allsrc.dev"
Repository = "https://github.com/allsrc/agent-taskbay"
Documentation = "https://github.com/allsrc/agent-taskbay/blob/main/sdk/python/README.md"
Issues = "https://github.com/allsrc/agent-taskbay/issues"
