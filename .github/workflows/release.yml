name: Release

# Publishes to npm when a version tag is pushed, for example `git tag v0.1.1 && git push origin v0.1.1`.
# Authenticates with npm trusted publishing (OIDC): no token is stored. The package's trusted publisher on npmjs.com must name this
# repository (allsrc/agent-taskbay) and this workflow file (release.yml). Provenance is generated automatically.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing (11.5.1+)
        run: npm install -g npm@11
      - run: npm ci
      - name: Tag must match package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          test "$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1; }
      - run: npm run lint
      - run: npm test
      - run: npm run verify:package
      - name: Publish
        run: |
          channel=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          npm publish --provenance --access public --tag "$channel"
      - name: GitHub release
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next } found' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then notes="--notes-file release-notes.md"; else notes="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" $notes --verify-tag $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
        env:
          GH_TOKEN: ${{ github.token }}
