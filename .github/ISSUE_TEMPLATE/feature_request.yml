name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: spec
    attributes:
      label: Where does it fit in the spec?
      description: Optional. A requirement ID from docs/spec/PRODUCT_SPEC.md, a phase in docs/spec/PHASES.md, or a note that it is new scope.
